[project]
name = "shab-mcp"
version = "1.4.0"
description = "MCP server for Shab accommodation APIs (sandbox v1.4) — discovery + guest booking assistant."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Shab", email = "ai@shab.ir" },
]
keywords = ["mcp", "shab", "accommodation", "iran"]
dependencies = [
    "fastmcp>=2.3,<3",
    "httpx>=0.27",
    "jdatetime>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
shab-mcp = "shab_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: calls the real Shab API (run with -m live)",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
